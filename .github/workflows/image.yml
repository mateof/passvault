name: Container image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The token the workflow already has. No secret to create and none to rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` follows main and a tag publishes its own version, so a NAS pinned to a
          # version stays where it is and one following latest gets every merge.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Built and started before it is published, because the image is pruned hard — build
      # leftovers, source maps, drivers no default installation loads — and the way that goes
      # wrong is a file missing at import time, which no Dockerfile syntax check would notice.
      # A container that answers its own health endpoint has resolved every module it needs.
      - name: Build and smoke test
        run: |
          docker build -t passvault:smoke .
          docker run -d --name smoke -e MASTER_KEY="$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=')" \
            -e BLIND_INDEX_KEY="$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=')" \
            -p 8080:8080 passvault:smoke
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health; then ready=1; break; fi
            sleep 2
          done
          docker logs smoke
          docker rm -f smoke
          test -n "${ready:-}" || { echo "::error::the image did not answer /api/v1/health"; exit 1; }
          echo "image size: $(docker image inspect passvault:smoke --format '{{.Size}}' | awk '{printf "%.0f MB\n", $1/1048576}')"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # linux/amd64 only. A Synology on an Intel or AMD processor is what this is for, and
          # arm64 would double every build for a target nobody has yet — better-sqlite3 is
          # compiled from source in the image, so a second architecture is not free.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
